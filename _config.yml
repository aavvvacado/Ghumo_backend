# Ghumo Backend API Documentation Site - Stygian theme
title: Ghumo Backend API
url: "https://aavvvacado.github.io"
baseurl: "/Ghumo_backend"
description: >-
  Scalable travel discovery engine, real-time search, place intelligence,
  zero-hallucination image resolution, and community rating API.

remote_theme: ksauraj/stygian

# ------------------------------------------------------------------ build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# ------------------------------------------------------------------ content
collections:
  docs:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: docs
  - scope:
      path: ""
      type: pages
    values:
      layout: page

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
